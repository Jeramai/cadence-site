<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <meta name="robots" content="noindex" />
    <!-- Build source for assets/img/og.png. Not linked from the site. -->
    <link rel="stylesheet" href="assets/css/styles.css" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--ground);
      }
      .og {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        overflow: hidden;
      }
      .og::before {
        content: '';
        position: absolute;
        right: -180px;
        top: -180px;
        width: 720px;
        height: 720px;
        background: radial-gradient(circle, var(--glow), transparent 62%);
      }
      .og__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        position: relative;
      }
      .og__brand img {
        width: 40px;
        height: 40px;
      }
      .og__title {
        position: relative;
        font-size: 54px;
        line-height: 1.12;
        font-weight: 600;
        letter-spacing: -0.03em;
        max-width: 660px;
        background: linear-gradient(to right, var(--grad-from), var(--grad-to));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .og__foot {
        position: relative;
        display: flex;
        gap: 40px;
        align-items: center;
        font-size: 20px;
        color: var(--text-dim);
      }
      .og__chip {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .og__dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--brand);
      }
      .og__ring {
        position: absolute;
        right: 80px;
        bottom: 150px;
        width: 240px;
        height: 240px;
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="og__brand">
        <img src="assets/img/logo-ink.svg" alt="" />
        <span>Cadence</span>
      </div>

      <h1 class="og__title">Corporate wellness that proves the workout happened.</h1>

      <div class="og__foot">
        <span class="og__chip"><span class="og__dot"></span>On device camera verification</span>
        <span class="og__chip"><span class="og__dot"></span>One daily ring</span>
        <span class="og__chip"><span class="og__dot"></span>Zero frames uploaded</span>
      </div>

      <svg class="og__ring" viewBox="0 0 200 200" style="transform: rotate(-90deg)">
        <circle cx="100" cy="100" r="82" fill="none" stroke="var(--ring-track)" stroke-width="14" />
        <circle
          cx="100"
          cy="100"
          r="82"
          fill="none"
          stroke="var(--brand)"
          stroke-width="14"
          stroke-linecap="round"
          stroke-dasharray="412 999"
        />
      </svg>
    </div>
  </body>
</html>
